# cargo-about: the license notices of the crates the apps link, which the picker's build
# writes into THIRD_PARTY_NOTICES.txt beside the JavaScript packages' (notices.ts), and the app
# embeds with the picker. MIT, ISC and BSD ask for their notice in every copy, and Apache-2.0
# for a copy of the license. about.hbs is the template.
#
# The accepted licenses are deny.toml's allow list, as for the server's notices in the
# repository's about.toml; a test in scripts/licenses keeps them the same. Their order is the
# preference when a crate offers a choice: the first one it offers is the notice that ships.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "Python-2.0",
]

# Every platform the apps are built for: crates that none of them uses are left out.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
# Code that runs while the app builds or its tests run, and is not part of it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crates whose packages put several licenses in one file or leave their license out, as
# cargo-about's documentation lists them.
workarounds = ["ring", "rustls", "prost", "rustix"]

[private]
# The app's own crate carries the project license and is never published.
ignore = true
