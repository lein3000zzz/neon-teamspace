# Both images built from this checkout rather than pulled, under local names, so a build never
# carries a release's name: `make up`, `make e2e` and a stack run from a clone add this file.
#
#   docker compose -f deployments/docker-compose.yml -f deployments/docker-compose.build.yml up -d --build
#
# Each `up` builds them again, which the build cache makes quick when nothing changed, so the
# stack always runs what the checkout holds.
services:
  server:
    image: neon-workspace-server:local
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    pull_policy: build

  web:
    image: neon-workspace-web:local
    build:
      context: ..
      dockerfile: web/Dockerfile
    pull_policy: build
