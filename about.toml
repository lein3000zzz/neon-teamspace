# cargo-about: the license notices that go with the server's and the updater's binaries, which
# link their crates statically. MIT, ISC and BSD ask for their notice in every copy, and
# Apache-2.0 for a copy of the license. deployments/Dockerfile writes the notices into the
# server image and the updater image, with about.hbs as the template.
#
# The accepted licenses are deny.toml's allow list, which cargo-deny enforces; a test in
# scripts/licenses keeps the two the same. Their order is the preference when a crate offers
# a choice: the first one it offers is the notice that ships.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "Python-2.0",
]

# The images' platforms: crates that only other platforms use are left out. The updater's binary
# is built for musl, whose crates are its glibc build's.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Code that runs while the binary builds or its tests run, and is not part of it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crates whose packages put several licenses in one file or leave their license out, as
# cargo-about's documentation lists them.
workarounds = ["ring", "rustls", "prost", "rustix"]

[private]
# The workspace's own crates carry the project license and are never published.
ignore = true

# The crate compiles jemalloc from the C sources it bundles, which come under jemalloc's
# BSD-2-Clause license beside the crate's own. A new version of the crate changes these
# checksums, which turns the clarification off; the image build then fails until they are
# updated from the new version's files.
[tikv-jemalloc-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-2-Clause"

[[tikv-jemalloc-sys.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "378f5840b258e2779c39418f3f2d7b2ba96f1c7917dd6be0713f88305dbda397"

[[tikv-jemalloc-sys.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[tikv-jemalloc-sys.clarify.files]]
path = "jemalloc/COPYING"
license = "BSD-2-Clause"
checksum = "94aa2caa98c25d942f58b956c71dba6a99ff98fc3a31cbc669fe2a4cd0268b53"
