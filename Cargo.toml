[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lein3000zzz/neon-workspace"
publish = false

[workspace.dependencies]
neon-domain = { path = "crates/domain" }
neon-store = { path = "crates/store" }
neon-app = { path = "crates/app" }
neon-observability = { path = "crates/observability" }

anyhow = "1.0.104"
arc-swap = "1.9.5"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.9", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
# The ring provider with bundled webpki roots: no OpenSSL and no aws-lc build tooling,
# and TLS works in minimal images without a system CA store.
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "time",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "sensitive-headers", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.9"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables keep profiles and backtraces readable at a small size cost.
debug = "line-tables-only"
