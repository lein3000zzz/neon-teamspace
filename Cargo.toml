[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lein3000zzz/neon-teamspace"
publish = false

[workspace.dependencies]
neon-domain = { path = "crates/domain" }
neon-blocks = { path = "crates/blocks" }
neon-store = { path = "crates/store" }
neon-app = { path = "crates/app" }
neon-observability = { path = "crates/observability" }

aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
arc-swap = "1.9.5"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
# HMAC-SHA256, which signs webhooks both ways.
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
ipnet = "2.12.2"
# SMTP over rustls on ring with the bundled webpki roots, as sqlx: no OpenSSL, and TLS works
# in minimal images. No connection pool, as the settings are read again for every mail.
lettre = { version = "0.11.24", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
# The CommonMark and GFM parser of the block converter, without its command line and HTML
# renderer.
pulldown-cmark = { version = "0.13.6", default-features = false }
rand = "0.10.4"
# The MCP server, over the Streamable HTTP transport with its sessions, and in tests its client.
rmcp = { version = "3.11.0", default-features = false }
rpassword = "7.5.5"
# The JSON schemas of the MCP tools' arguments, the version rmcp publishes them with.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
# The ring provider with bundled webpki roots: no OpenSSL and no aws-lc build tooling,
# and TLS works in minimal images without a system CA store.
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "time",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.9"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v7"] }
# Yjs in Rust: the pages' documents, which the editor in the browser edits with Yjs.
yrs = "0.28.2"
zeroize = "1.9.2"
# Zip archives of markdown, imported and exported: stored and deflated entries only, read and
# written in memory.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables keep profiles and backtraces readable at a small size cost.
debug = "line-tables-only"
