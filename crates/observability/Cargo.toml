[package]
name = "neon-observability"
description = "Logs, metrics, traces, profiles, the admin listener and ordered shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Not the workspace's axum, which keeps the default features: only what the admin listener uses.
axum = { version = "0.8.9", default-features = false, features = ["http1", "matched-path", "query", "tokio"] }
http = "1.5.0"
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { workspace = true, features = ["internal-logs", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "internal-logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["internal-logs", "trace"] }
pin-project-lite = "0.2.18"
prost = { version = "0.14.6", default-features = false, features = ["std"] }
pyroscope = { version = "2.1.5", default-features = false, features = ["backend-pprof-rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-opentelemetry = { workspace = true, features = ["tracing-log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
uuid.workspace = true

# Heap profiles come from jemalloc, which only produces usable backtraces on Linux. It is built
# from its C sources, so Linux builds need a C compiler and make.
[target.'cfg(target_os = "linux")'.dependencies]
jemalloc_pprof = { version = "0.9.0", features = ["symbolize"] }
pyroscope = { version = "2.1.5", default-features = false, features = ["backend-jemalloc"] }
tikv-jemallocator = { version = "0.7.0", features = ["profiling"] }

[dev-dependencies]
flate2 = "1.1.11"
metrics-util.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
