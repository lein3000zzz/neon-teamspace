[package]
name = "neon-server"
description = "The neon binary: HTTP API, realtime sync, MCP, webhooks and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neon"
path = "src/main.rs"

[dependencies]
neon-app.workspace = true
neon-blocks.workspace = true
neon-domain.workspace = true
neon-observability.workspace = true
neon-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
bytes.workspace = true
clap.workspace = true
figment.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
ipnet = { workspace = true, features = ["serde"] }
lettre.workspace = true
metrics.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
rpassword.workspace = true
schemars = { workspace = true, features = ["uuid1"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing"] }
tokio.workspace = true
# TLS for outgoing webhooks, on ring as the rest of the server, with the web PKI's roots
# bundled so it works in minimal images.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, features = ["time", "uuid"] }
utoipa-axum.workspace = true
uuid = { workspace = true, features = ["serde"] }
webpki-roots = "1.0.12"

[dev-dependencies]
base64.workspace = true
figment = { workspace = true, features = ["test"] }
futures-util = { workspace = true, features = ["sink"] }
metrics-util.workspace = true
# An MCP client over Streamable HTTP, without TLS, for the MCP server's tests.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# A self-signed certificate and a TLS listener, for the SMTP adapter's tests.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# WebSocket clients for the real-time sync's tests, the version axum's server side uses.
tokio-tungstenite = "0.30.0"
tower = { workspace = true, features = ["util"] }
yrs.workspace = true
# Zips to import, and to read exports with, in the import and export tests.
zip.workspace = true

[lints]
workspace = true
