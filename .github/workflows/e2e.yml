# The end-to-end tests of the real images: the images built from the checkout, a throwaway
# Compose stack of the server and web images, and the tests against it, all through make e2e,
# which checks the updater image too. Before each release, which calls this workflow, with the
# server and the updater in the release profile and no cache; and by hand, in Cargo's quicker
# e2e profile. Pull requests and pushes run the same tests in the CI workflow instead, on the
# server binary its Rust build compiled.
name: E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A run is never cancelled. Named apart from the callers' groups, as a called workflow sees
    # its caller's name.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests run with Bun on the runner; Docker, Compose and Buildx come with the image.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
      # A BuildKit container for make's bake, which, unlike Docker's own builder, reads the
      # Actions cache, from a pinned image as in release.yml. Bake loads the images it builds
      # into Docker for Compose to run.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      # The Actions cache's URL and token, which only actions see otherwise, for bake to reach
      # the cache from a run step. Not in a tag's run, the one before a release: the token
      # writes to the cache as well as reading it, so the release's tests, with every package
      # and browser they install, are not handed one. Code on the runner could still read the
      # job's token from the runner process's memory, which is why the release's images read
      # no cache at all.
      - if: github.ref_type != 'tag'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # A run by hand reads the web image's layers that CI's E2E saves on a push to dev, and
      # saves none; the server and the updater compile without a cache. A tag's run neither
      # reads nor saves, and builds every image from the checkout alone, the server and the
      # updater as the published images are built, in the release profile. Under make -j2 the
      # images build while make e2e-install installs the tests' browser and its system libraries.
      - name: Build the images, start the stack, run the tests
        env:
          USE_CACHE: ${{ github.ref_type != 'tag' }}
          E2E_CARGO_PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'e2e' }}
        run: |
          flags=""
          if [ "$USE_CACHE" = true ]; then
            flags="--set web.cache-from=type=gha,scope=e2e-web"
          fi
          make -j2 e2e E2E_BUILD_FLAGS="$flags"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
