# The end-to-end tests: both images built from the checkout, a throwaway Compose stack, and
# the tests against it, all through make e2e. On each pull request into main; on a pull
# request into dev only when it changes the images, the stack or the tests; by hand; and
# before each release, which calls this workflow.
name: E2E

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    # Only a pull request into dev is filtered. Called from a release, the event is the
    # tag's push, so this is skipped and the tests run.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request's files come from the API
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            e2e:
              - deployments/**
              - web/Dockerfile
              - web/Caddyfile
              - e2e/**
              - .github/workflows/e2e.yml

  e2e:
    name: E2E
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result == 'skipped' ||
       (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A newer push to the pull request cancels its run; a release's run is never cancelled.
    # Named apart from the callers' groups, as a called workflow sees its caller's name.
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests run with Bun on the runner; Docker, Compose and Buildx come with the image.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
      - name: Build the images, start the stack, run the tests
        run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
