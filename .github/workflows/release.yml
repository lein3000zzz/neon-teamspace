# A release, on a version tag such as v1.2.3. Each job starts only once the one before it
# passed, so nothing is published, signed or attested unless every check did: the version
# check, which needs the tag to name the workspace's version; the end-to-end tests of the
# release build; the server and web images for linux/amd64 and linux/arm64 on GHCR, built from
# the tag without a cache, with OCI labels, an SBOM and build provenance; beside them the apps,
# desktop on each platform's runner and Android on Linux, also built from the tag without a
# cache; and a GitHub release with the Compose archive, the apps' installers and a SHA256SUMS
# file of them attached, whose notes name the images and their tags and link the docs, before
# the ones GitHub generates from the merged pull requests; its job gives the apps' files their
# build provenance. It needs no secret but the workflow's own token, and the Android
# keystore's, when the repository has them, to sign the APK in a job of its own. A release has
# no iOS app: that builds on a Mac with Xcode, outside this workflow.
#
# No job that publishes or signs reads the Actions cache, which is neither signed nor checked:
# a tag's run restores what its own ref or the default branch saved, which any code that ran in
# one of their jobs with the job's token could have written. Nor does such a job trust an
# artifact of the run as it finds it, as the same token lets any job of the run replace one: the
# job that built a file passes its SHA-256 on as a job output, which only that job can set, and
# the job that signs or attaches the file checks it first. Nor can the apps' build reach the
# workflow's OIDC token, with which the crates' build scripts or the packages' code could attest
# any file as this workflow's: the jobs that build or sign the apps get none, and the release
# job attests the apps' files once it has checked them. The images build inside BuildKit, which
# their job's OIDC token does not reach.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, Cargo.toml and everything that states the version agree, neon --version among
  # them, which builds the server; make version-check lists what does not.
  version:
    name: Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      # The cache CI's Versions job saves on main, which a tag's run may read. A tag's run
      # saves none.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: versions
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
      - name: Every stated version is the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: make version-check TAG="$TAG"

  e2e:
    name: E2E
    needs: version
    uses: ./.github/workflows/e2e.yml
    # The called workflow's pull request filter asks for pull-requests: read, and a called
    # workflow may only narrow what its caller grants, even for a job that is skipped.
    permissions:
      contents: read
      pull-requests: read

  images:
    name: Image (${{ matrix.image }})
    needs: [version, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with the workflow's OIDC identity
    strategy:
      matrix:
        include:
          - image: neon-teamspace-server
            dockerfile: deployments/Dockerfile
            description: The Neon Teamspace server, the neon binary
          - image: neon-teamspace-web
            dockerfile: web/Dockerfile
            description: The Neon Teamspace web app and docs, behind Caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: each Dockerfile compiles on the runner's platform and cross-compiles for the
      # other, so a step that would need emulation fails instead of running slowly. BuildKit
      # runs from a pinned image rather than the builder's moving default tag.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 gives 1.2.3, 1.2, 1 and latest; v0.4.1 gives 0.4.1, 0.4 and latest, as a 0
      # major version promises nothing across minor ones; a pre-release such as v1.3.0-rc.1
      # gives only itself. The labels and annotations say the version, the commit, the
      # repository and the license; GitHub reads the description from the index's. Unless told,
      # the action takes the title, the description and the license of both from the
      # repository, whose license GitHub reports as NOASSERTION, so both lists name all three.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # On the index too, where GHCR reads a multi-platform image's description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          # The SBOM from a pinned scanner image rather than BuildKit's moving default tag.
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          # No layer cache, read or written: the published images build from the tag's checkout
          # and the digest-pinned base images alone. The Actions cache is neither signed nor
          # checked, and a tag's run restores what its own ref or the default branch saved, so
          # a cached layer could put into a signed image what no file of the tag holds. A
          # re-run of a failed release builds everything again.
          no-cache: true
      # Every release is signed, each platform's image too, for a pull by its own digest.
      # Keyless signing records the signer, this repository and the commit in Sigstore's
      # public transparency log, so as a safety net both steps are skipped should the
      # repository ever be private, rather than publishing a private repository's details.
      - if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - if: ${{ !github.event.repository.private }}
        name: Sign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE"

  # The desktop apps, each built on its platform's runner, as Tauri's guide has it. Unsigned:
  # signing for macOS and Windows needs certificates the project does not hold, so the apps docs
  # say how to open them the first time. Linux builds on the oldest Ubuntu runner, as the
  # AppImage carries that system's WebKitGTK, and the app needs its glibc, 2.35, or a later
  # one. The release job attests their build provenance, not this one, which runs the crates'
  # build scripts and the packages' code and so has no OIDC token to sign with.
  # Nothing comes from the Actions cache, as for the images: no crates built before, nor Bun
  # itself. Unsigned as the apps are, their attestations and checksums vouch for them, and a
  # cached build could put into them what no file of the tag holds. Without a cache every run
  # builds everything, as a release's first run did anyway, since no other workflow saves a
  # cache under these jobs' keys.
  desktop:
    name: App (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # Each platform's files with their SHA-256, under an output of its own, so the matrix's
    # jobs set them side by side.
    outputs:
      linux-x86_64: ${{ steps.collect.outputs.linux-x86_64 }}
      windows-x86_64: ${{ steps.collect.outputs.windows-x86_64 }}
      macos-aarch64: ${{ steps.collect.outputs.macos-aarch64 }}
      macos-x86_64: ${{ steps.collect.outputs.macos-x86_64 }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            id: linux-x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: Windows x86_64
            id: windows-x86_64
            runner: windows-2025
            args: --bundles nsis
          - name: macOS Apple silicon
            id: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            id: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --no-self-update
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
          rustc --version
      # cargo-about writes the crates' notices, which the picker's build embeds.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3
          fallback: none
      # Bun from its release, not from the copy setup-bun keeps in the Actions cache.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
          no-cache: true
      # The packages as make app-install installs them, without make, which Windows lacks.
      - name: Packages
        working-directory: apps/shell
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/shell
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<<"$ARGS"
          bun run tauri build --ci "${args[@]}"
      # The installers, named for the release without the spaces of the product's name. Tauri
      # names them after the apps' version, which a release candidate's tag follows with -rc.
      # and its number, so a candidate's installers are renamed for its tag, as its APK is
      # named. Then each file's SHA-256, as this platform's output.
      - id: collect
        name: Collect the installers
        env:
          ID: ${{ matrix.id }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' apps/shell/src-tauri/Cargo.toml | head -n 1)"
          release="${TAG#v}"
          mkdir -p release-assets
          find apps/shell/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \
            -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              name="${name// /-}"
              cp "$file" "release-assets/${name/"$version"/$release}"
            done
          ls -l release-assets
          test -n "$(ls release-assets)"
          # sha256sum on Linux and Windows, shasum on macOS; either prints the hash first.
          sha256() {
            if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi | cut -d ' ' -f 1
          }
          {
            echo "$ID<<SHA256_END"
            for file in release-assets/*; do
              hash="$(sha256 < "$file")"
              printf '%s  %s\n' "$hash" "${file#release-assets/}"
            done
            echo SHA256_END
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # The Android APK, for every ABI in one file, built unsigned: the job runs Gradle's plugins,
  # the crates' build scripts and the packages' code, and none of them gets the signing key.
  # Nothing comes from the Actions cache, as for the desktop apps: no crates built before, no
  # Bun, and no Gradle cache, which setup-java keeps only when asked to; Gradle checks its own
  # download against the checksum in gradle-wrapper.properties.
  android:
    name: App (Android)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The unsigned APK's SHA-256, which the signing job checks the artifact against.
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      APK: apps/shell/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android \
            x86_64-linux-android
          rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3
          fallback: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
          no-cache: true
      - run: make app-install
      # The runner's SDK comes with NDKs; the newest is the one Tauri builds with.
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/shell
        run: bun run tauri android build --ci --apk
      - id: checksum
        name: Checksum
        run: |
          sha256="$(sha256sum < "$APK" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 1

  # The APK as the release attaches it, on a runner of its own where nothing but the SDK's tools
  # runs. Signed when the repository has the keystore's secrets: ANDROID_KEY_BASE64, the keystore
  # in base64; ANDROID_KEY_ALIAS, its key's alias; and ANDROID_KEY_PASSWORD, the password of
  # both. Without them the APK stays unsigned, and its name says so: Android installs no
  # unsigned APK until someone signs it. Only once the end-to-end tests passed too, so that the
  # key signs no APK of a release they failed. Then the SHA-256 of the APK it attaches, as its
  # output: the hash alone, as GitHub drops an output of this job that holds one of its secrets'
  # values, and the key's alias could be any word of the APK's name. The release job attests
  # the APK, as it does the desktop installers.
  android-release:
    name: App (Android, release)
    needs: [android, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      SIGNED: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: built
      # The APK the build job made, and no other, before the key touches it.
      - name: Check the APK
        env:
          SHA256: ${{ needs.android.outputs.sha256 }}
        run: echo "$SHA256  built/app-universal-release-unsigned.apk" | sha256sum --check --strict
      # The SDK's newest build tools check that the APK is aligned, as Gradle packs it, with
      # its native libraries on 16 KB pages, then sign it and check the signature. The keystore
      # lives only in this step, outside any checkout, and goes once it is used.
      - if: env.SIGNED == 'true'
        name: Sign
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n 1)"
          tools="$ANDROID_HOME/build-tools/$version"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          base64 -d <<<"$KEY_BASE64" > "$keystore"
          "$tools/zipalign" -c -P 16 4 built/app-universal-release-unsigned.apk
          mkdir -p release-assets
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "release-assets/Neon-Teamspace_${GITHUB_REF_NAME#v}_android.apk" \
            built/app-universal-release-unsigned.apk
          "$tools/apksigner" verify --verbose release-assets/*.apk
      - if: env.SIGNED != 'true'
        name: Name the unsigned APK
        run: |
          mkdir -p release-assets
          cp built/app-universal-release-unsigned.apk \
            "release-assets/Neon-Teamspace_${GITHUB_REF_NAME#v}_android-unsigned.apk"
      - id: checksum
        name: Checksum
        run: |
          apks=(release-assets/*.apk)
          test "${#apks[@]}" -eq 1
          sha256="$(sha256sum < "${apks[0]}" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [images, desktop, android-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # the attestation's signing certificate, from the workflow's OIDC identity
      attestations: write
    steps:
      # The tag's commit, which make compose-archive reads the archive's files from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose archive
        run: make compose-archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: release-assets
          merge-multiple: true
      # The apps' files as the jobs that built them list them in their outputs: each of them,
      # with its SHA-256, and no other. The APK's name is the one android-release gives it,
      # signed or not.
      - name: Check the apps' files
        env:
          TAG: ${{ github.ref_name }}
          DESKTOP: ${{ toJSON(needs.desktop.outputs) }}
          APK_SHA256: ${{ needs.android-release.outputs.sha256 }}
        run: |
          built="$RUNNER_TEMP/built.sha256"
          apk="Neon-Teamspace_${TAG#v}_android.apk"
          if [ ! -e "release-assets/$apk" ]; then apk="Neon-Teamspace_${TAG#v}_android-unsigned.apk"; fi
          { jq -r '.[]' <<<"$DESKTOP"; printf '%s  %s\n' "$APK_SHA256" "$apk"; } | sed '/^$/d' > "$built"
          cut -d ' ' -f 3- "$built" | sort > "$RUNNER_TEMP/built"
          find release-assets -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/downloaded"
          diff -u "$RUNNER_TEMP/built" "$RUNNER_TEMP/downloaded"
          (cd release-assets && sha256sum --check --strict "$built")
      # Each of them gets build provenance, an attestation of the workflow run and the commit
      # that made it, here rather than in the jobs that built them, which run the crates' build
      # scripts and the packages' code, and only once every check passed. As a safety net, as
      # for the images' signatures, not should the repository ever be private, where GitHub
      # keeps attestations only on Enterprise plans.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      # One file of the SHA-256 checksums of everything the release attaches, as sha256sum
      # --check reads it.
      - name: Checksums
        run: |
          cp dist/neon-teamspace-compose-*.tar.gz release-assets/
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The notes go before the ones GitHub generates from the pull requests merged since the
      # newest full release, so a release that follows its candidates lists every one of them;
      # before the first, GitHub picks where its list starts. The archive is how an install of
      # the published images starts, and the apps' installers and SHA256SUMS are attached
      # beside it; the Caddyfile is part of the web image, so it is not attached. A
      # pre-release, such as a release candidate, is marked as one, its apps' files too, and
      # GitHub never shows it as the latest release.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGES: ghcr.io/${{ github.repository_owner }}
          FILES: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
          SIGNED: ${{ !github.event.repository.private }}
        run: |
          version="${TAG#v}"
          # Named after the workspace's version, which a release candidate's tag follows with
          # -rc. and its number.
          archives=(dist/neon-teamspace-compose-*.tar.gz)
          archive="${archives[0]}"
          release="${archive#dist/neon-teamspace-compose-}"
          release="${release%.tar.gz}"
          # The tags the images job gave, as its metadata step chooses them.
          prerelease=()
          tags="\`$version\`, \`${version%.*}\`"
          case "$version" in 0.*) ;; *) tags="$tags, \`${version%%.*}\`" ;; esac
          tags="$tags and \`latest\`"
          case "$version" in *-*) prerelease=(--prerelease); tags="\`$version\` alone" ;; esac
          start=()
          newest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$newest" ]; then
            start=(--notes-start-tag "$newest")
          fi
          candidate=""
          apps=""
          if [ "$release" != "$version" ]; then
            candidate=" This pre-release rehearses $release: unless \`NEON_VERSION=$version\` is set in \`deployments/.env\`, the Compose file runs the images of $release, which only that release publishes."
            apps=" Their names carry this pre-release's version, $version."
          fi
          signed="They are not signed, as the repository is private."
          if [ "$SIGNED" = true ]; then
            signed="They are signed with cosign's keyless signing; [Upgrading]($FILES/docs/src/content/docs/self-hosting/upgrading.md#checking-the-images) shows how to check them."
          fi
          notes="## Images

          For \`linux/amd64\` and \`linux/arm64\`, with an SBOM and build provenance, tagged $tags. $signed

          - \`$IMAGES/neon-teamspace-server:$version\`
          - \`$IMAGES/neon-teamspace-web:$version\`

          ## Installing and upgrading

          \`${archive#dist/}\`, below, holds the Compose file that runs these images, with its example settings.$candidate [Install]($FILES/docs/src/content/docs/self-hosting/install.md) starts an instance from it, and [Upgrading]($FILES/docs/src/content/docs/self-hosting/upgrading.md) moves one to this release. [CHANGELOG.md]($FILES/CHANGELOG.md) says what the release changes, and what it needs of an instance's admins.

          ## Apps

          The desktop installers and the Android APK are below.$apps [Apps]($FILES/docs/src/content/docs/guides/apps.md) covers installing them, checking them against \`SHA256SUMS\` and their build provenance, and connecting them to a server."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --generate-notes "${start[@]}" --notes "$notes" "${prerelease[@]}" release-assets/*
