# cargo-deny: dependency licenses, advisories, duplicate versions and sources.
# Only permissive licenses and MPL-2.0 are allowed, so the project's own license
# stays a free choice: no GPL or AGPL code is linked in.
#
# The license allow list is also the policy for the JS packages of the web app
# and the docs: scripts/licenses.ts reads it, so Rust and JS follow one list.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Some entries are only used by JS packages, which cargo-deny does not see.
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Python-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The workspace's own crates carry the project license and are never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
